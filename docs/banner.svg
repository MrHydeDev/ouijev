<svg xmlns="http://www.w3.org/2000/svg" width="753" height="224" viewBox="0 0 753 224" role="img" aria-label="OUIJEV. hyde@sunnydale:~$ ./ouijev &quot;is anyone there?&quot; and the spirit answers YES">
<style>
  text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 14px; fill: #ffcf7a; }
  .title { fill: #5d6679; font-size: 11px; }
  .prompt { fill: #b98f4f; font-size: 13px; }
