  .answer { fill: #9dffce; font-size: 15px; font-weight: bold; }
  .l { animation: wave 2.6s ease-in-out infinite; }
  .typed { animation: type 10s infinite; }
  .spelled { animation: spelled 10s infinite; }
  .aura { animation: aura 10s ease-in-out infinite; }
  .cursor { animation: blink 1s steps(1) infinite; }
  .at30 { animation: at30 10s infinite; }
  .at36 { animation: at36 10s infinite; }
  .at42 { animation: at42 10s infinite; }
  .at48 { animation: at48 10s infinite; }
  @keyframes wave { 0%, 100% { transform: translateY(3.08px); } 50% { transform: translateY(-3.22px); } }
  @keyframes blink { 50% { opacity: 0; } }
  /* The question is typed a character at a time, and everything goes quiet before the next round */
  @keyframes type {
    0%, 6% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(27, end); }
    24%, 92% { clip-path: inset(0 0 0 0); opacity: 1; }
    100% { clip-path: inset(0 0 0 0); opacity: 0; }
  }
  @keyframes spelled { 0%, 29% { opacity: 0; } 30%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes aura { 0%, 28% { opacity: 0; } 40%, 86% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes at30 { 0%, 29.5% { opacity: 0; } 30%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes at36 { 0%, 35.5% { opacity: 0; } 36%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes at42 { 0%, 41.5% { opacity: 0; } 42%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes at48 { 0%, 47.5% { opacity: 0; } 48%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .l, .typed, .spelled, .aura, .cursor, .at30, .at36, .at42, .at48 { animation: none; }
  }
</style>
